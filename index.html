<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบแจ้งปัญหาจราจร / เส้นทาง</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-5xl mx-auto">
<h1 class="text-2xl font-bold mb-4">ระบบแจ้งปัญหาจราจร / เส้นทาง</h1>
<div class="bg-white p-4 rounded shadow mb-4">
<form id="trafficReportForm">
<div class="grid gap-3">
<input id="companyName" placeholder="บริษัท" class="border p-2 rounded">
<input id="reporterName" placeholder="ผู้แจ้ง" class="border p-2 rounded">
<select id="symbolType" class="border p-2 rounded">
<option value="ก่อสร้าง">🚧 ก่อสร้าง</option>
<option value="น้ำท่วม">🌊 น้ำท่วม</option>
<option value="ต้นไม้">🌳 ต้นไม้</option>
</select>
<button type="button" onclick="saveItem()" class="bg-green-600 text-white p-2 rounded">บันทึก</button>
</div>
</form>
</div>
<div class="bg-white p-4 rounded shadow mb-4">
<div class="grid md:grid-cols-3 gap-3 mb-3">
<input id="searchLocation" onkeyup="loadReports()" placeholder="ค้นหาสถานที่" class="border p-2 rounded">
<select id="filterStatus" onchange="loadReports()" class="border p-2 rounded">
<option value="">ทุกสถานะ</option>
<option>แจ้งเตือน (รอแก้ไข)</option>
<option>กำลังดำเนินการ</option>
<option>แก้ไขแล้ว</option>
</select>
<select id="filterType" onchange="loadReports()" class="border p-2 rounded">
<option value="">ทุกประเภท</option>
<option>ก่อสร้าง</option>
<option>น้ำท่วม</option>
<option>ต้นไม้</option>
</select>
</div>
<div id="reportList"></div>
</div>
</div>
<script>
const initialData=[];
function getStoredData(){return JSON.parse(localStorage.getItem('company_traffic_reports')||'[]')}
function saveItem(){const data=getStoredData();data.unshift({location:'ตัวอย่าง',status:'แจ้งเตือน (รอแก้ไข)',symbol:document.getElementById('symbolType').value});localStorage.setItem('company_traffic_reports',JSON.stringify(data));loadReports();}
function loadReports(){let data=getStoredData();const keyword=(document.getElementById('searchLocation')?.value||'').toLowerCase();const statusFilter=document.getElementById('filterStatus')?.value||'';const typeFilter=document.getElementById('filterType')?.value||'';data=data.filter(item=>(!keyword||(item.location||'').toLowerCase().includes(keyword))&&(!statusFilter||item.status===statusFilter)&&(!typeFilter||item.symbol===typeFilter));document.getElementById('reportList').innerHTML=data.map(i=>`<div class="border p-2 mb-2 rounded">${i.symbol} ${i.location} - ${i.status}</div>`).join('');}
loadReports();
</script>
</body>
</html>
